<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
}

body {
    background: url('https://raw.githubusercontent.com/hispik2/background-sekolah/main/background.jpg') no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    padding: 20px 15px 80px;
    position: relative;
    color: #fff;
}

/* Container Utama */
.main-container {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

/* Banner Judul Main */
.main-header {
    background: #0d2757;
    text-align: center;
    padding: 12px 20px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    margin-bottom: 5px;
}

.main-header h1 {
    color: #ffc107;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

/* Card Section Box */
.section-card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(8px);
    border-radius: 20px;
    padding: 12px 18px 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

/* Header Kategori / Section */
.category-header {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #0d2757;
    color: #ffffff;
    padding: 6px 20px 6px 14px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 14px;
}

.category-header svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
}

/* Grid Layouts */
.grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.grid-5 {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

.grid-requests {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 10px;
}

/* Tombol Oranye Umum */
.btn-orange {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(135deg, #f58220 0%, #d96b00 100%);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 12px 10px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    line-height: 1.2;
    box-shadow: 0 3px 6px rgba(0,0,0,0.16);
    transition: transform 0.2s, box-shadow 0.2s;
    min-height: 54px;
}

.btn-orange:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.25);
    background: linear-gradient(135deg, #ff8c2b 0%, #e57200 100%);
}

.btn-orange svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
    flex-shrink: 0;
}

/* Tombol Kontak (WhatsApp Green Style) */
.contact-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.btn-contact {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #eef9f2;
    border: 1.5px solid #25d366;
    border-radius: 14px;
    padding: 10px 15px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.btn-contact:hover {
    background: #dcf5e7;
    transform: translateY(-2px);
}

.btn-contact svg {
    width: 32px;
    height: 32px;
    fill: #25d366;
}

.contact-text {
    text-align: left;
}

.contact-title {
    color: #0d2757;
    font-size: 14px;
    font-weight: 800;
}

.contact-sub {
    color: #25d366;
    font-size: 12px;
    font-weight: 700;
}

/* Custom Spanning Grid untuk Section Requests */
.span-2 { grid-column: span 2; }
.span-3 { grid-column: span 3; }

/* Responsive adjustments */
@media (max-width: 900px) {
    .grid-5, .grid-requests {
        grid-template-columns: repeat(3, 1fr);
    }
    .span-2, .span-3 {
        grid-column: span 1;
    }
}

@media (max-width: 650px) {
    .grid-3, .grid-5, .grid-requests, .contact-grid {
        grid-template-columns: 1fr;
    }
    .main-header h1 {
        font-size: 20px;
    }
}
</style>
